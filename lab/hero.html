<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wir Studio: próby hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Inter+Tight:wght@400;500;900&family=Schibsted+Grotesk:wght@400..900&family=JetBrains+Mono:wght@400&display=swap">
<script>
/* entrance C: the loader's oval is drawn by CSS from the first paint (before the libraries arrive) */
(function(){var w=(new URLSearchParams(location.search).get('w')||'C').toUpperCase(),d=document.documentElement;
  if('CDG'.indexOf(w)>-1)d.classList.add('pre');if('EF'.indexOf(w)>-1)d.classList.add('pre-dark')})();
</script>
<style>
/* Lab page: four hero layouts × four title faces, switchable (1–4 / A–D, also ?v=&f= in the address).
   Scroll down to see how the window grows to the full screen (the original's curve: edges quad out over 75 %,
   corners after; title, note and stripes fade over the first half). Units follow the original's rem (--r). */
:root{--paper:#fcfcfc;--ink:#050505;--r:3.8647vw;--gut:calc(var(--r)*1.25);
  --face:"Inter Tight";--wdth:100;--ls:-.04em;--fw:900}
@media (min-width:600px){:root{--r:2.0833vw}}
@media (min-width:1025px){:root{--r:min(1.1111vw,2.5556vh)}}
html[data-f="2"]{--face:"Archivo";--wdth:100}
html[data-f="3"]{--face:"Archivo";--wdth:125;--ls:-.045em}
html[data-f="4"]{--face:"Schibsted Grotesk";--ls:-.045em}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.45 "Inter Tight",Arial,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}

.hd{position:fixed;inset:0 0 auto;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:var(--gut) var(--gut) calc(var(--r)*1.125);color:#fff;mix-blend-mode:difference;pointer-events:none}
.logo{font:var(--fw) 22px/1 var(--face),Arial,sans-serif;font-stretch:calc(var(--wdth)*1%);letter-spacing:-.02em;text-transform:uppercase}
.dots{width:calc(var(--r)*2.5);height:calc(var(--r)*2.5);min-width:36px;min-height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.2);display:grid;place-items:center}
.dots i{width:4px;height:4px;border-radius:50%;background:currentColor;box-shadow:-8px 0 0 currentColor,8px 0 0 currentColor}

.hero{position:relative;height:230svh}
.pin{position:sticky;top:0;height:100svh;overflow:clip;background:var(--paper);display:flex;flex-direction:column;padding:calc(var(--gut) + var(--r)*3.625) var(--gut) calc(var(--r)*7.6875 + 1px)}
/* the black stage: fixed, cut to the window's rectangle (set every frame from the placeholder .win) */
.stage{position:fixed;inset:0;height:100lvh;background:var(--ink);z-index:1;pointer-events:none;clip-path:inset(50% 50% 50% 50%)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
/* title version d: the smoke layer over the title (WebGL), shown only while it plays */
.smoke{position:absolute;z-index:3;pointer-events:none;display:none}
/* entrance C: while the page loads, a black oval stands in the middle of the empty page (the original's preloader, without
   pictures); the script takes it over at exactly this size and place (10 × 10.5rem) and carries it into the O */
html.pre .stage{clip-path:ellipse(calc(var(--r)*5) calc(var(--r)*5.25) at 50% 50svh)}
html.pre .note,html.pre .stripes,html.pre .hd{visibility:hidden}
/* entrances E and F start where the intro's scroll ends: the whole screen black (the coil comes with the script) */
html.pre-dark .stage{clip-path:none}
html.pre-dark .note,html.pre-dark .stripes{visibility:hidden}
.fade{position:relative;z-index:2}
.title{margin:0;font-family:var(--face),Arial,sans-serif;font-weight:var(--fw);font-stretch:calc(var(--wdth)*1%);letter-spacing:var(--ls);line-height:.84;text-transform:uppercase;font-size:var(--fs,4rem);white-space:nowrap}
.title .ln{display:block;perspective:calc(var(--r)*31.25)}
.title .ch{display:inline-block;transform:translateZ(-.85em) rotateX(var(--rx,0deg)) scaleY(var(--sy,1)) translateZ(.85em);backface-visibility:hidden}
.title .gap{display:inline-block}
.title .sp{display:inline-block;width:.26em}
.win{display:block;flex:none}
.note{margin:0;width:calc(var(--r)*16.25);font:400 calc(var(--r)*.9375)/1.2 "Inter Tight",Arial,sans-serif;text-align:justify;text-align-last:left;text-indent:4.75em}
.note .w{display:inline-block;text-indent:0;transform:translateZ(-1em) rotateX(var(--rx,0deg)) scaleY(var(--sy,1)) translateZ(1em);backface-visibility:hidden}
.note .w:first-child{margin-right:1.35em}
.stripes{position:absolute;left:0;right:0;bottom:0;display:grid;z-index:2}
.stripes i{display:block;overflow:hidden}
.stripes i::before{content:"";display:block;height:100%;background:var(--ink);transform:translateY(var(--y,0%))}
.stripes i:nth-child(1){height:calc(var(--r)*.25)}
.stripes i:nth-child(2){height:calc(var(--r)*.5);margin-top:var(--r)}
.stripes i:nth-child(3){height:calc(var(--r)*2.5);margin-top:calc(var(--r)*.75)}
/* (the original's top hairline of the stripes and the header's hairline are left out: Grzegorz, 10.10) */
.pin{padding-bottom:calc(var(--r)*6.5)}
@media (min-width:1025px){.pin{padding-top:calc(var(--gut) + 55px);padding-bottom:calc(var(--r)*7.8)}}
/* desktop, layouts 1 and 2: the note's first line stands level with the top of the title's capitals (set in JS) */
@media (min-width:1025px){[data-v="1"] .note{top:var(--nt,calc(var(--gut) + 55px))!important}}

/* ---- 1 · staircase (closest to the original): left-aligned lines stepping in, the window in a gap of the last line;
   phones: centred, the window under the title (the original's base layout) ---- */
[data-v="1"] .pin{justify-content:center;align-items:center}
[data-v="1"] .title{text-align:center}
[data-v="1"] .gap{display:none}
[data-v="1"] .win{width:calc(var(--r)*15);aspect-ratio:260/160;margin:2.44svh auto 4.61svh}
[data-v="1"] .note{align-self:center}
@media (min-width:600px){[data-v="1"] .win{width:calc(var(--r)*20)}}
@media (min-width:1025px){
  [data-v="1"] .pin{justify-content:flex-start;align-items:flex-start;padding-left:max(var(--gut),calc(50vw - var(--r)*41.8125))}
  [data-v="1"] .title{text-align:left;margin-top:max(calc(var(--r)*-1.875),-4vh)}
  [data-v="1"] .ln:nth-child(2){margin-left:1.94em}
  [data-v="1"] .ln:nth-child(3){margin-left:1.93em;display:flex;align-items:flex-start}
  [data-v="1"] .gap{display:inline-block;width:1.8571em;margin-right:.11em;flex:none}
  [data-v="1"] .gap .win{width:100%;margin:.05em 0 0}
  [data-v="1"] .win.solo{display:none}
  [data-v="1"] .note{position:absolute;top:calc(var(--gut) + 55px);right:var(--gut)}
}

/* ---- 2 · the window is the O: "T▢ NASZ", an oval the height of the capitals, centred lines; scrolling grows the
   letter itself into the screen (the original's FOR uses a drawn glyph for its O) ---- */
[data-v="2"] .pin{justify-content:center;align-items:center;gap:calc(var(--r)*3)}
[data-v="2"] .title{text-align:center}
[data-v="2"] .win.solo{display:none}
/* the O is the glyph's own outline, measured from the face (advance, ink box): an empty inline-block on the baseline
   with the window hung from it; the white coil fills the O's counter */
[data-v="2"] .gap{width:var(--ow,.78em);height:0;vertical-align:baseline;position:relative}
[data-v="2"] .gap .win{position:absolute;left:var(--ol,0em);bottom:var(--od,0em);width:var(--obw,.78em);height:var(--obh,.74em)}
/* desktop, as Grzegorz placed them (10.10, 1536×742): the title 5.68rem left of the middle and 1.07rem up, the note at
   the bottom right, 2.8rem above the stripes (5rem of stripes + 2.8) */
@media (min-width:1025px){
  [data-v="2"] .title{position:relative;left:calc(var(--r)*-5.68);top:calc(var(--r)*-1.07)}
  [data-v="2"] .note{position:absolute;bottom:calc(var(--r)*7.8);right:calc(var(--gut) + var(--r)*.38)}
}

/* ---- 3 · frame: the first line across the top, the window wide in the middle, the last word across the bottom;
   each line set to the full width, so the type frames the picture ---- */
[data-v="3"] .pin{justify-content:space-between;gap:calc(var(--r)*1.5)}
[data-v="3"] .gap{display:none}
[data-v="3"] .title{display:contents}
[data-v="3"] .ln{font-size:var(--lfs)}
[data-v="3"] .win{flex:1;min-height:0;width:100%;border-radius:4px}
[data-v="3"] .note{align-self:flex-end;margin-top:calc(var(--r)*-.5)}
@media (min-width:1025px){
  /* (desktop: both lines at one size, the first to the left edge and the last to the right, so the window keeps its height) */
  [data-v="3"] .ln:last-of-type{align-self:flex-end}
  [data-v="3"] .win{width:62%;align-self:center}
  [data-v="3"] .note{position:absolute;left:var(--gut);top:50%;translate:0 -50%;margin:0;width:calc(var(--r)*14)}
}

/* ---- 4 · overlap: three full-width lines, the window behind the middle of them; the title is drawn in difference,
   so it is black on white and white on the black window ---- */
[data-v="4"] .pin{justify-content:center;align-items:center;gap:calc(var(--r)*2.5)}
[data-v="4"] .gap{display:none}
[data-v="4"] .title{text-align:center;color:#fff;mix-blend-mode:difference}
[data-v="4"] .win{position:absolute;left:50%;top:var(--wy,50%);translate:-50% -50%;width:calc(var(--r)*15);aspect-ratio:260/160}
@media (min-width:600px){[data-v="4"] .win{width:calc(var(--r)*24)}}
@media (min-width:1025px){[data-v="4"] .win{width:calc(var(--r)*30)}[data-v="4"] .note{position:absolute;right:var(--gut);bottom:calc(var(--r)*9)}}

.after{position:relative;z-index:3;background:var(--ink);color:#f2f2f2;min-height:60svh;padding:20svh var(--gut);font:400 calc(var(--r)*2.25)/1 Georgia,serif}

/* switcher */
.ctl{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0px));translate:-50% 0;z-index:30;display:flex;flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 16px);align-items:center;gap:4px;padding:5px;background:#fff;border:1px solid #d6d6d6;border-radius:22px;box-shadow:0 4px 18px rgba(0,0,0,.12);font:400 11px/1 "JetBrains Mono",monospace;white-space:nowrap}
@media (max-width:420px){.ctl .cap,.ctl .sep{display:none}.ctl{gap:2px;padding:4px}.ctl button{min-width:26px;height:26px;padding:0 6px}}
/* the panel folds away to its last button, so the whole screen (stripes included) can be judged */
.ctl.min>*:not(#fold){display:none}
.ctl button{min-width:30px;height:30px;padding:0 8px;border-radius:999px;color:#333}
.ctl button[aria-pressed="true"]{background:#050505;color:#fff}
.ctl .cap{padding:0 4px 0 8px;color:#888;text-transform:uppercase;letter-spacing:.04em}
.ctl .sep{width:1px;height:18px;background:#d6d6d6;margin:0 3px}
.lbl{position:fixed;left:50%;bottom:calc(52px + env(safe-area-inset-bottom,0px));translate:-50% 0;z-index:30;background:#050505;color:#fff;padding:6px 10px;border-radius:999px;font:400 10px/1 "JetBrains Mono",monospace;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;transition:opacity .4s}
.lbl.off{opacity:0}
/* edit mode: drag the title and the note (finger or mouse); the offsets are kept in the address and can be copied */
.edit .title,.edit .note{outline:1px dashed #e3261b;outline-offset:6px;cursor:grab;touch-action:none}
.edit .lbl{opacity:1!important;white-space:normal;max-width:calc(100vw - 24px);text-align:center;line-height:1.5}
.ctl .ed{display:none}.edit .ctl .ed{display:inline-block}
</style>
</head>
<body>
<header class="hd"><span class="logo">Wir</span><span class="dots"><i></i></span></header>
<section class="hero"><div class="pin" id="pin">
  <div class="stage" id="stage"><canvas id="cv"></canvas></div>
  <h1 class="title fade" id="title"></h1>
  <div class="win solo" id="winSolo"></div>
  <p class="note fade" id="note">Małe, niezależne studio, które od 2014 roku projektuje i koduje strony z ruchem dla marek, które nie chcą wyglądać jak wszyscy.</p>
  <div class="stripes fade" id="stripes"><i></i><i></i><i></i></div>
</div></section>
<section class="after">Tu zaczyna się manifest (czarna sala). Przewiń w górę, żeby wrócić do hero.</section>
<div class="lbl" id="lbl"></div>
<!-- the filter of title version 3 (turbulent displacement + blur) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="fxSmoke" x="-15%" y="-25%" width="130%" height="150%" color-interpolation-filters="sRGB">
    <feTurbulence id="fxSmokeT" type="fractalNoise" baseFrequency="0.012 0.03" numOctaves="2" seed="7" result="t"/>
    <feDisplacementMap id="fxSmokeD" in="SourceGraphic" in2="t" scale="0" xChannelSelector="R" yChannelSelector="G" result="d"/>
    <feGaussianBlur id="fxSmokeB" in="d" stdDeviation="0"/>
  </filter>
</svg>
<nav class="ctl" aria-label="Warianty">
  <span class="cap">tytuł</span><button data-fx="d3">d3 · dym z „O”</button>
  <span class="sep"></span>
  <button id="replay" title="Odtwórz wejście">↻</button>
  <span class="sep"></span>
  <button id="edit" title="Przesuwanie elementów">przesuń</button><button class="ed" id="copy">kopiuj</button><button class="ed" id="zero">zeruj</button>
  <button id="fold" title="Zwiń / rozwiń panel">▾</button>
</nav>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script>
(function(){
  const H=document.documentElement,title=document.getElementById('title'),pin=document.getElementById('pin'),stage=document.getElementById('stage'),
    cv=document.getElementById('cv'),note=document.getElementById('note'),lbl=document.getElementById('lbl'),winSolo=document.getElementById('winSolo');
  const VN={1:'schodki (jak cappen)',2:'okno jako litera O',3:'rama: napis wokół okna',4:'napis na oknie (różnica)'};
  const FN={1:'Inter Tight Black (jak Helvetica Now)',2:'Archivo Black, normalna szerokość',3:'Archivo Black 125% (obecny)',4:'Schibsted Grotesk Black'};
  const XN={0:'gaśnie (jak cappen)',1:'rozmycie',2:'rozsunięcie od O',3:'rozsunięcie i rozmycie'};
  // chosen 10.10: layout 2 with face A (the others stay reachable with ?v=&f=); the switch now compares the title's exit
  const q=new URLSearchParams(location.search);let V=q.get('v')||'2',F=q.get('f')||'1',X=q.get('x')||'1',IN=(q.get('w')||'C').toUpperCase(),FX=q.get('fx')||'d3',NX='a';
  const DBG=q.get('dbg')==='smoke';
  // (?dbg=smoke also paints the black stage dark blue, so tools/motion.py does not take the loader's oval for ink)
  if(DBG){stage.style.background='#000050';cv.style.visibility='hidden'}   // (and hides the coil: its dark shades read as ink)
  const FXN={3:'zawirowanie',5:'dym z „O”',7:'zbieranie a · szept','7b':'zbieranie b · podmuch','7c':'zbieranie c · kłąb',d1:'dym jasny z lewej (zwolnione tempo)',d2:'dym jak tusz z lewej',d3:'dym jasny z „O”'};
  const WN={A:'jak w oryginale',B:'najpierw O, litery falą od niego',C:'elipsa ładowania wskakuje w O',D:'nawijanie drutu, potem w O',
    E:'z wnętrza O: czerń się kurczy, napis wyostrza',F:'nawijanie w czerni, potem z wnętrza O',G:'wir wyrzuca litery po spirali'};
  const probe=document.createElement('i');probe.style.cssText='position:absolute;width:calc(var(--r)*1);visibility:hidden';document.body.append(probe);
  const R=()=>probe.getBoundingClientRect().width;
  const desk=()=>innerWidth>=1025;

  /* title lines per layout ({o} = the window as a letter, {w} = the window in a gap) */
  const LINES={1:['Ruch','To nasz','{w}Materiał'],2:['Ruch','T{o} nasz','Materiał'],3:['Ruch to nasz','Materiał'],4:['Ruch','to nasz','materiał']};
  // (a word space of its own: at -.04em tracking a plain space let "TO NASZ" read as one word)
  const chars=s=>[...s].map(c=>c===' '?'<span class="sp"> </span>':`<span class="ch">${c}</span>`).join('');
  function build(){
    title.innerHTML=LINES[V].map(l=>`<span class="ln">${l.replace(/\{w\}|\{o\}|[^{}]+/g,m=>m==='{w}'?'<span class="gap"><span class="win" id="winIn"></span></span>':m==='{o}'?'<span class="gap"><span class="win" id="winIn"></span></span>':`<span class="tx">${chars(m)}</span>`)}</span>`).join('');
    // layout 3: the window sits between the two lines
    if(V==='3'){title.children[0].after(winSolo)}else title.after(winSolo);
  }
  /* sizes: 1 and 2 use the original's 4 / 7.5 / 8.75rem, shrunk only if a line would not fit; 3 sets every line to the
     full width; 4 sets all three to the width of the widest, capped by the height */
  function fit(){
    if(V==='2')measureO();
    const avail=pin.clientWidth-2*parseFloat(getComputedStyle(pin).paddingRight);
    const lns=[...title.querySelectorAll('.ln')];
    title.style.setProperty('--fs','100px');lns.forEach(l=>l.style.removeProperty('--lfs'));
    // the width of the line's contents (a range, not the line's box: in a flex column the box is always full width), plus its indent
    const wid=l=>{const r=document.createRange();r.selectNodeContents(l);return r.getBoundingClientRect().width+(parseFloat(getComputedStyle(l).marginLeft)||0)};
    if(V==='3'){lns.forEach(l=>l.style.setProperty('--lfs','100px'));
      if(desk()){const fs=Math.min(100*avail/Math.max(...lns.map(wid))*.97,R()*7);lns.forEach(l=>l.style.setProperty('--lfs',Math.floor(fs)+'px'))}
      else lns.forEach(l=>l.style.setProperty('--lfs',Math.floor(100*avail/wid(l)*.97)+'px'));return}
    const widest=Math.max(...lns.map(wid));let fs=100*avail/widest*.97;
    const base=R()*(V==='2'?(innerWidth>=1025?9.75:innerWidth>=600?8.4:4):(innerWidth>=1025?8.75:innerWidth>=600?7.5:4));
    if(V==='1'||V==='2')fs=Math.min(fs,V==='2'&&!desk()?fs:base);
    // (4: the three lines fill the height left between the header and the stripes; on desktop also above the note)
    if(V==='4'){const ps=getComputedStyle(pin),inner=pin.clientHeight-parseFloat(ps.paddingTop)-parseFloat(ps.paddingBottom);
      const room=inner-(desk()?note.offsetHeight+R()*2:note.offsetHeight+R()*2.5);fs=Math.min(fs,room/(3*.84));
      title.style.marginBottom=desk()?(note.offsetHeight+R()*2)+'px':''}   // (desktop: the centred title keeps clear of the note below it)
    else title.style.marginBottom='';
    title.style.setProperty('--fs',Math.floor(fs)+'px');FS=Math.floor(fs);
  }
  function apply(){H.dataset.v=V;H.dataset.f=F;
    document.querySelectorAll('.ctl [data-fx]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.fx===FX));
    document.querySelectorAll('.ctl [data-nx]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.nx===NX));
    history.replaceState(null,'',query());
    lbl.textContent=IN==='C'?'Tytuł '+(FXN[FX]||FX)+'  /  notka od środka, nierówno':'Wejście '+IN+' · '+WN[IN];lbl.classList.remove('off');clearTimeout(apply.t);apply.t=setTimeout(()=>lbl.classList.add('off'),3500);
    build();fit();if(V==='4')placeWin4();splitNote();applyOff();alignNote();cacheCh();scrollTo(0,0);enter()}
  /* ---- offsets set by hand (in rem, so they hold at every width) ---- */
  const num=v=>(v||'0,0').split(',').map(Number);const OFF={t:num(q.get('t')),n:num(q.get('n'))};
  const query=()=>'?v='+V+'&f='+F+'&x='+X+'&w='+IN+'&fx='+FX+'&nx='+NX+(OFF.t[0]||OFF.t[1]?'&t='+OFF.t.join(','):'')+(OFF.n[0]||OFF.n[1]?'&n='+OFF.n.join(','):'');
  function applyOff(){title.style.translate=OFF.t[0]||OFF.t[1]?(OFF.t[0]*R())+'px '+(OFF.t[1]*R())+'px':'';
    note.style.translate=OFF.n[0]||OFF.n[1]?(OFF.n[0]*R())+'px '+(OFF.n[1]*R())+'px':''}
  const offText=()=>'tytuł x '+OFF.t[0]+' y '+OFF.t[1]+' · notka x '+OFF.n[0]+' y '+OFF.n[1]+' (rem; '+innerWidth+'×'+innerHeight+')';
  function drag(el,key){let sx=0,sy=0,o0=null;
    el.addEventListener('pointerdown',e=>{if(!H.classList.contains('edit'))return;e.preventDefault();el.setPointerCapture(e.pointerId);sx=e.clientX;sy=e.clientY;o0=OFF[key].slice()});
    el.addEventListener('pointermove',e=>{if(!o0)return;const r=R();OFF[key]=[+(o0[0]+(e.clientX-sx)/r).toFixed(2),+(o0[1]+(e.clientY-sy)/r).toFixed(2)];applyOff();lbl.textContent=offText()});
    const end=()=>{if(!o0)return;o0=null;history.replaceState(null,'',query());alignNote();cacheCh()};
    el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end)}
  drag(title,'t');drag(note,'n');
  /* the note's first line level with the top of the title's capitals: the baseline of the first line (an empty
     inline-block on it) minus the cap height, and the same for the note's own first line */
  const capH=font=>{const c=capH.c||(capH.c=document.createElement('canvas').getContext('2d'));c.font=font;return c.measureText('H').actualBoundingBoxAscent};
  const baseMark=()=>{const b=document.createElement('i');b.style.cssText='display:inline-block;width:0;height:0;vertical-align:baseline';return b};
  function alignNote(){H.style.removeProperty('--nt');if(!desk()||V!=='1')return;

              x.c.style.opacity=(outF>2?clamp(out/Math.min(ramp,outF)):clamp(1-shift/(x.hw*.5))).toFixed(3)})},
            onComplete:()=>sp.items.forEach(x=>{x.c.style.translate=x.c.style.opacity=''})}))})},null,T0);
      lines(under?T0+1.2:T0+.5);bars(T0+.7)}
    else{const fresh=!enter.ran,D=IN==='D';frame.lastP=0;Object.assign(E,{win:fresh?1:0,go:0,coil:D?1:0,spin:D?1.2:2.5,wind:D?0:1});gsap.set('.hd',{opacity:0});
      /* C · the oval with a fast-turning coil goes into the O. D · the same, but first the wire is wound along its length
             in the oval (1.5 s, the loader). */
      if(!fresh)tl.to(E,{win:1,duration:.6,ease:'power4.out'},0);
      if(D)tl.to(E,{wind:1,duration:1.5,ease:'power2.inOut'},fresh?.1:.4);else tl.to(E,{coil:1,duration:.8,ease:'power3.out'},fresh?0:.2);
      const M=D?(fresh?1.7:2):(fresh?.9:1.2);
      tl.to(E,{go:1,duration:1.15,ease:'power4.inOut'},M).to(E,{spin:0,duration:1.4,ease:'power2.out'},M)
        .to('.hd',{opacity:1,duration:.6,ease:'power1.out'},M+.6);
      if(D){flip(M+.5,.035);linesAfter(M+.9,M+.5,.035*(ch.length-1));bars(M+1)}
      // (Grzegorz 10.10: the note starts half-way through the title's appearance)
      // (5 opens from the O, so it waits until the oval is in it: earlier, the travelling oval crossed letters already shown)
      // (the note starts with the core of 7 and the stripes after it — the same times for every version, as Grzegorz asked)
      // (d3 starts once the oval is in the O, and its note when the smoke's front has passed the title's middle)
      else{const t0=M+.45,ts=FX==='5'||FX==='d3'?M+1.1:t0;titleIn(ts);const ne=noteIn(FX==='d3'?ts+3.3*.55:t0+DUR*C0);bars(ne-.3)}}
    enter.ran=true}
  document.querySelectorAll('.ctl [data-fx]').forEach(b=>b.onclick=()=>{FX=b.dataset.fx;IN='C';apply()});
  document.querySelectorAll('.ctl [data-nx]').forEach(b=>b.onclick=()=>{NX=b.dataset.nx;IN='C';apply()});
  document.getElementById('replay').onclick=()=>{scrollTo(0,0);enter()};
  document.getElementById('fold').onclick=e=>{const m=document.querySelector('.ctl').classList.toggle('min');e.currentTarget.textContent=m?'▴':'▾';lbl.classList.toggle('off',m)};
  document.getElementById('edit').onclick=e=>{const on=H.classList.toggle('edit');e.currentTarget.setAttribute('aria-pressed',on);scrollTo(0,0);
    if(on){tl&&tl.progress(1);lbl.textContent=offText();lbl.classList.remove('off')}else apply()};
  document.getElementById('copy').onclick=()=>{const t=offText()+'\n'+location.href;navigator.clipboard?navigator.clipboard.writeText(t).then(()=>{lbl.textContent='Skopiowano: '+offText()},()=>{lbl.textContent=t}):lbl.textContent=t};
  document.getElementById('zero').onclick=()=>{OFF.t=[0,0];OFF.n=[0,0];applyOff();history.replaceState(null,'',query());alignNote();cacheCh();lbl.textContent=offText()};
  addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='3'||k==='5'||k==='7'){FX=k;IN='C';apply()}});
  let lastW=innerWidth;addEventListener('resize',()=>{size();if(innerWidth!==lastW){lastW=innerWidth;fit();if(V==='4')placeWin4();applyOff();alignNote();cacheCh()}});
  size();
  // every face is loaded before the first measure, so switching never fits a line in a fallback font
  const FACES=['900 100px "Inter Tight"','400 15px "Inter Tight"','900 100px Archivo','900 100px "Schibsted Grotesk"'];
  Promise.race([document.fonts?Promise.all(FACES.map(f=>document.fonts.load(f))).catch(()=>{}):0,new Promise(r=>setTimeout(r,3000))]).then(()=>{apply();requestAnimationFrame(frame)});
})();
</script>
