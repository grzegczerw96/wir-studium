<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wir Studio: próby hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Inter+Tight:wght@400;500;900&family=Schibsted+Grotesk:wght@400..900&family=JetBrains+Mono:wght@400&display=swap">
<script>
/* entrance C: the loader's oval is drawn by CSS from the first paint (before the libraries arrive) */
if((new URLSearchParams(location.search).get('w')||'C').toUpperCase()==='C')document.documentElement.classList.add('pre');
</script>
<style>
/* Lab page: four hero layouts × four title faces, switchable (1–4 / A–D, also ?v=&f= in the address).
   Scroll down to see how the window grows to the full screen (the original's curve: edges quad out over 75 %,
   corners after; title, note and stripes fade over the first half). Units follow the original's rem (--r). */
:root{--paper:#fcfcfc;--ink:#050505;--r:3.8647vw;--gut:calc(var(--r)*1.25);
  --face:"Inter Tight";--wdth:100;--ls:-.04em;--fw:900}
@media (min-width:600px){:root{--r:2.0833vw}}
@media (min-width:1025px){:root{--r:min(1.1111vw,2.5556vh)}}
html[data-f="2"]{--face:"Archivo";--wdth:100}
html[data-f="3"]{--face:"Archivo";--wdth:125;--ls:-.045em}
html[data-f="4"]{--face:"Schibsted Grotesk";--ls:-.045em}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.45 "Inter Tight",Arial,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}

.hd{position:fixed;inset:0 0 auto;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:var(--gut) var(--gut) calc(var(--r)*1.125);color:#fff;mix-blend-mode:difference;pointer-events:none}
.logo{font:var(--fw) 22px/1 var(--face),Arial,sans-serif;font-stretch:calc(var(--wdth)*1%);letter-spacing:-.02em;text-transform:uppercase}
.dots{width:calc(var(--r)*2.5);height:calc(var(--r)*2.5);min-width:36px;min-height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.2);display:grid;place-items:center}
.dots i{width:4px;height:4px;border-radius:50%;background:currentColor;box-shadow:-8px 0 0 currentColor,8px 0 0 currentColor}

.hero{position:relative;height:230svh}
.pin{position:sticky;top:0;height:100svh;overflow:clip;background:var(--paper);display:flex;flex-direction:column;padding:calc(var(--gut) + var(--r)*3.625) var(--gut) calc(var(--r)*7.6875 + 1px)}
/* the black stage: fixed, cut to the window's rectangle (set every frame from the placeholder .win) */
.stage{position:fixed;inset:0;height:100lvh;background:var(--ink);z-index:1;pointer-events:none;clip-path:inset(50% 50% 50% 50%)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
/* entrance C: while the page loads, a black oval stands in the middle of the empty page (the original's preloader, without
   pictures); the script takes it over at exactly this size and place (10 × 10.5rem) and carries it into the O */
html.pre .stage{clip-path:ellipse(calc(var(--r)*5) calc(var(--r)*5.25) at 50% 50svh)}
html.pre .note,html.pre .stripes,html.pre .hd{visibility:hidden}
.fade{position:relative;z-index:2}
.title{margin:0;font-family:var(--face),Arial,sans-serif;font-weight:var(--fw);font-stretch:calc(var(--wdth)*1%);letter-spacing:var(--ls);line-height:.84;text-transform:uppercase;font-size:var(--fs,4rem);white-space:nowrap}
.title .ln{display:block;perspective:calc(var(--r)*31.25)}
.title .ch{display:inline-block;transform:translateZ(-.85em) rotateX(var(--rx,0deg)) scaleY(var(--sy,1)) translateZ(.85em);backface-visibility:hidden}
.title .gap{display:inline-block}
.title .sp{display:inline-block;width:.26em}
.win{display:block;flex:none}
.note{margin:0;width:calc(var(--r)*16.25);font:400 calc(var(--r)*.9375)/1.2 "Inter Tight",Arial,sans-serif;text-align:justify;text-align-last:left;text-indent:4.75em}
.note .w{display:inline-block;text-indent:0;transform:translateZ(-1em) rotateX(var(--rx,0deg)) scaleY(var(--sy,1)) translateZ(1em);backface-visibility:hidden}
.note .w:first-child{margin-right:1.35em}
.stripes{position:absolute;left:0;right:0;bottom:0;display:grid;z-index:2}
.stripes i{display:block;overflow:hidden}
.stripes i::before{content:"";display:block;height:100%;background:var(--ink);transform:translateY(var(--y,0%))}
.stripes i:nth-child(1){height:calc(var(--r)*.25)}
.stripes i:nth-child(2){height:calc(var(--r)*.5);margin-top:var(--r)}
.stripes i:nth-child(3){height:calc(var(--r)*2.5);margin-top:calc(var(--r)*.75)}
/* (the original's top hairline of the stripes and the header's hairline are left out: Grzegorz, 10.10) */
.pin{padding-bottom:calc(var(--r)*6.5)}
@media (min-width:1025px){.pin{padding-top:calc(var(--gut) + 55px);padding-bottom:calc(var(--r)*7.8)}}
/* desktop, layouts 1 and 2: the note's first line stands level with the top of the title's capitals (set in JS) */
@media (min-width:1025px){[data-v="1"] .note{top:var(--nt,calc(var(--gut) + 55px))!important}}

/* ---- 1 · staircase (closest to the original): left-aligned lines stepping in, the window in a gap of the last line;
   phones: centred, the window under the title (the original's base layout) ---- */
[data-v="1"] .pin{justify-content:center;align-items:center}
[data-v="1"] .title{text-align:center}
[data-v="1"] .gap{display:none}
[data-v="1"] .win{width:calc(var(--r)*15);aspect-ratio:260/160;margin:2.44svh auto 4.61svh}
[data-v="1"] .note{align-self:center}
@media (min-width:600px){[data-v="1"] .win{width:calc(var(--r)*20)}}
@media (min-width:1025px){
  [data-v="1"] .pin{justify-content:flex-start;align-items:flex-start;padding-left:max(var(--gut),calc(50vw - var(--r)*41.8125))}
  [data-v="1"] .title{text-align:left;margin-top:max(calc(var(--r)*-1.875),-4vh)}
  [data-v="1"] .ln:nth-child(2){margin-left:1.94em}
  [data-v="1"] .ln:nth-child(3){margin-left:1.93em;display:flex;align-items:flex-start}
  [data-v="1"] .gap{display:inline-block;width:1.8571em;margin-right:.11em;flex:none}
  [data-v="1"] .gap .win{width:100%;margin:.05em 0 0}
  [data-v="1"] .win.solo{display:none}
  [data-v="1"] .note{position:absolute;top:calc(var(--gut) + 55px);right:var(--gut)}
}

/* ---- 2 · the window is the O: "T▢ NASZ", an oval the height of the capitals, centred lines; scrolling grows the
   letter itself into the screen (the original's FOR uses a drawn glyph for its O) ---- */
[data-v="2"] .pin{justify-content:center;align-items:center;gap:calc(var(--r)*3)}
[data-v="2"] .title{text-align:center}
[data-v="2"] .win.solo{display:none}
/* the O is the glyph's own outline, measured from the face (advance, ink box): an empty inline-block on the baseline
   with the window hung from it; the white coil fills the O's counter */
[data-v="2"] .gap{width:var(--ow,.78em);height:0;vertical-align:baseline;position:relative}
[data-v="2"] .gap .win{position:absolute;left:var(--ol,0em);bottom:var(--od,0em);width:var(--obw,.78em);height:var(--obh,.74em)}
/* desktop, as Grzegorz placed them (10.10, 1536×742): the title 5.68rem left of the middle and 1.07rem up, the note at
   the bottom right, 2.8rem above the stripes (5rem of stripes + 2.8) */
@media (min-width:1025px){
  [data-v="2"] .title{position:relative;left:calc(var(--r)*-5.68);top:calc(var(--r)*-1.07)}
  [data-v="2"] .note{position:absolute;bottom:calc(var(--r)*7.8);right:calc(var(--gut) + var(--r)*.38)}
}

/* ---- 3 · frame: the first line across the top, the window wide in the middle, the last word across the bottom;
   each line set to the full width, so the type frames the picture ---- */
[data-v="3"] .pin{justify-content:space-between;gap:calc(var(--r)*1.5)}
[data-v="3"] .gap{display:none}
[data-v="3"] .title{display:contents}
[data-v="3"] .ln{font-size:var(--lfs)}
[data-v="3"] .win{flex:1;min-height:0;width:100%;border-radius:4px}
[data-v="3"] .note{align-self:flex-end;margin-top:calc(var(--r)*-.5)}
@media (min-width:1025px){
  /* (desktop: both lines at one size, the first to the left edge and the last to the right, so the window keeps its height) */
  [data-v="3"] .ln:last-of-type{align-self:flex-end}
  [data-v="3"] .win{width:62%;align-self:center}
  [data-v="3"] .note{position:absolute;left:var(--gut);top:50%;translate:0 -50%;margin:0;width:calc(var(--r)*14)}
}

/* ---- 4 · overlap: three full-width lines, the window behind the middle of them; the title is drawn in difference,
   so it is black on white and white on the black window ---- */
[data-v="4"] .pin{justify-content:center;align-items:center;gap:calc(var(--r)*2.5)}
[data-v="4"] .gap{display:none}
[data-v="4"] .title{text-align:center;color:#fff;mix-blend-mode:difference}
[data-v="4"] .win{position:absolute;left:50%;top:var(--wy,50%);translate:-50% -50%;width:calc(var(--r)*15);aspect-ratio:260/160}
@media (min-width:600px){[data-v="4"] .win{width:calc(var(--r)*24)}}
@media (min-width:1025px){[data-v="4"] .win{width:calc(var(--r)*30)}[data-v="4"] .note{position:absolute;right:var(--gut);bottom:calc(var(--r)*9)}}

.after{position:relative;z-index:3;background:var(--ink);color:#f2f2f2;min-height:60svh;padding:20svh var(--gut);font:400 calc(var(--r)*2.25)/1 Georgia,serif}

/* switcher */
.ctl{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0px));translate:-50% 0;z-index:30;display:flex;align-items:center;gap:4px;padding:5px;background:#fff;border:1px solid #d6d6d6;border-radius:999px;box-shadow:0 4px 18px rgba(0,0,0,.12);font:400 11px/1 "JetBrains Mono",monospace;white-space:nowrap}
.ctl button{min-width:30px;height:30px;padding:0 8px;border-radius:999px;color:#333}
.ctl button[aria-pressed="true"]{background:#050505;color:#fff}
.ctl .cap{padding:0 4px 0 8px;color:#888;text-transform:uppercase;letter-spacing:.04em}
.ctl .sep{width:1px;height:18px;background:#d6d6d6;margin:0 3px}
.lbl{position:fixed;left:50%;bottom:calc(52px + env(safe-area-inset-bottom,0px));translate:-50% 0;z-index:30;background:#050505;color:#fff;padding:6px 10px;border-radius:999px;font:400 10px/1 "JetBrains Mono",monospace;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;transition:opacity .4s}
.lbl.off{opacity:0}
/* edit mode: drag the title and the note (finger or mouse); the offsets are kept in the address and can be copied */
.edit .title,.edit .note{outline:1px dashed #e3261b;outline-offset:6px;cursor:grab;touch-action:none}
.edit .lbl{opacity:1!important;white-space:normal;max-width:calc(100vw - 24px);text-align:center;line-height:1.5}
.ctl .ed{display:none}.edit .ctl .ed{display:inline-block}
</style>
</head>
<body>
<header class="hd"><span class="logo">Wir</span><span class="dots"><i></i></span></header>
<section class="hero"><div class="pin" id="pin">
  <div class="stage" id="stage"><canvas id="cv"></canvas></div>
  <h1 class="title fade" id="title"></h1>
  <div class="win solo" id="winSolo"></div>
  <p class="note fade" id="note">Małe, niezależne studio, które od 2014 roku projektuje i koduje strony z ruchem dla marek, które nie chcą wyglądać jak wszyscy.</p>
  <div class="stripes fade" id="stripes"><i></i><i></i><i></i></div>
</div></section>
<section class="after">Tu zaczyna się manifest (czarna sala). Przewiń w górę, żeby wrócić do hero.</section>
<div class="lbl" id="lbl"></div>
<nav class="ctl" aria-label="Warianty">
  <span class="cap">wejście</span><button data-w="A">A</button><button data-w="B">B</button><button data-w="C">C</button>
  <span class="sep"></span>
  <button id="replay" title="Odtwórz wejście">↻</button>
  <span class="sep"></span>
  <button id="edit" title="Przesuwanie elementów">przesuń</button><button class="ed" id="copy">kopiuj</button><button class="ed" id="zero">zeruj</button>
</nav>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script>
(function(){
  const H=document.documentElement,title=document.getElementById('title'),pin=document.getElementById('pin'),stage=document.getElementById('stage'),
    cv=document.getElementById('cv'),note=document.getElementById('note'),lbl=document.getElementById('lbl'),winSolo=document.getElementById('winSolo');
  const VN={1:'schodki (jak cappen)',2:'okno jako litera O',3:'rama: napis wokół okna',4:'napis na oknie (różnica)'};
  const FN={1:'Inter Tight Black (jak Helvetica Now)',2:'Archivo Black, normalna szerokość',3:'Archivo Black 125% (obecny)',4:'Schibsted Grotesk Black'};
  const XN={0:'gaśnie (jak cappen)',1:'rozmycie',2:'rozsunięcie od O',3:'rozsunięcie i rozmycie'};
  // chosen 10.10: layout 2 with face A (the others stay reachable with ?v=&f=); the switch now compares the title's exit
  const q=new URLSearchParams(location.search);let V=q.get('v')||'2',F=q.get('f')||'1',X=q.get('x')||'1',IN=(q.get('w')||'C').toUpperCase();
  const WN={A:'jak w oryginale',B:'najpierw O, litery falą od niego',C:'ładowanie przechodzi w O'};
  const probe=document.createElement('i');probe.style.cssText='position:absolute;width:calc(var(--r)*1);visibility:hidden';document.body.append(probe);
  const R=()=>probe.getBoundingClientRect().width;
  const desk=()=>innerWidth>=1025;

  /* title lines per layout ({o} = the window as a letter, {w} = the window in a gap) */
  const LINES={1:['Ruch','To nasz','{w}Materiał'],2:['Ruch','T{o} nasz','Materiał'],3:['Ruch to nasz','Materiał'],4:['Ruch','to nasz','materiał']};
  // (a word space of its own: at -.04em tracking a plain space let "TO NASZ" read as one word)
  const chars=s=>[...s].map(c=>c===' '?'<span class="sp"> </span>':`<span class="ch">${c}</span>`).join('');
  function build(){
    title.innerHTML=LINES[V].map(l=>`<span class="ln">${l.replace(/\{w\}|\{o\}|[^{}]+/g,m=>m==='{w}'?'<span class="gap"><span class="win" id="winIn"></span></span>':m==='{o}'?'<span class="gap"><span class="win" id="winIn"></span></span>':`<span class="tx">${chars(m)}</span>`)}</span>`).join('');
    // layout 3: the window sits between the two lines
    if(V==='3'){title.children[0].after(winSolo)}else title.after(winSolo);
  }
  /* sizes: 1 and 2 use the original's 4 / 7.5 / 8.75rem, shrunk only if a line would not fit; 3 sets every line to the
     full width; 4 sets all three to the width of the widest, capped by the height */
  function fit(){
    if(V==='2')measureO();
    const avail=pin.clientWidth-2*parseFloat(getComputedStyle(pin).paddingRight);
    const lns=[...title.querySelectorAll('.ln')];
    title.style.setProperty('--fs','100px');lns.forEach(l=>l.style.removeProperty('--lfs'));
    // the width of the line's contents (a range, not the line's box: in a flex column the box is always full width), plus its indent
    const wid=l=>{const r=document.createRange();r.selectNodeContents(l);return r.getBoundingClientRect().width+(parseFloat(getComputedStyle(l).marginLeft)||0)};
    if(V==='3'){lns.forEach(l=>l.style.setProperty('--lfs','100px'));
      if(desk()){const fs=Math.min(100*avail/Math.max(...lns.map(wid))*.97,R()*7);lns.forEach(l=>l.style.setProperty('--lfs',Math.floor(fs)+'px'))}
      else lns.forEach(l=>l.style.setProperty('--lfs',Math.floor(100*avail/wid(l)*.97)+'px'));return}
    const widest=Math.max(...lns.map(wid));let fs=100*avail/widest*.97;
    const base=R()*(V==='2'?(innerWidth>=1025?9.75:innerWidth>=600?8.4:4):(innerWidth>=1025?8.75:innerWidth>=600?7.5:4));
    if(V==='1'||V==='2')fs=Math.min(fs,V==='2'&&!desk()?fs:base);
    // (4: the three lines fill the height left between the header and the stripes; on desktop also above the note)
    if(V==='4'){const ps=getComputedStyle(pin),inner=pin.clientHeight-parseFloat(ps.paddingTop)-parseFloat(ps.paddingBottom);
      const room=inner-(desk()?note.offsetHeight+R()*2:note.offsetHeight+R()*2.5);fs=Math.min(fs,room/(3*.84));
      title.style.marginBottom=desk()?(note.offsetHeight+R()*2)+'px':''}   // (desktop: the centred title keeps clear of the note below it)
    else title.style.marginBottom='';
    title.style.setProperty('--fs',Math.floor(fs)+'px');FS=Math.floor(fs);
  }
  function apply(){H.dataset.v=V;H.dataset.f=F;
    document.querySelectorAll('.ctl [data-w]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.w===IN));
    history.replaceState(null,'',query());
    lbl.textContent='Wejście '+IN+' · '+WN[IN]+'  /  wyjście '+X+' · '+XN[X];lbl.classList.remove('off');clearTimeout(apply.t);apply.t=setTimeout(()=>lbl.classList.add('off'),3500);
    build();fit();if(V==='4')placeWin4();splitNote();applyOff();alignNote();cacheCh();scrollTo(0,0);enter()}
  /* ---- offsets set by hand (in rem, so they hold at every width) ---- */
  const num=v=>(v||'0,0').split(',').map(Number);const OFF={t:num(q.get('t')),n:num(q.get('n'))};
  const query=()=>'?v='+V+'&f='+F+'&x='+X+'&w='+IN+(OFF.t[0]||OFF.t[1]?'&t='+OFF.t.join(','):'')+(OFF.n[0]||OFF.n[1]?'&n='+OFF.n.join(','):'');
  function applyOff(){title.style.translate=OFF.t[0]||OFF.t[1]?(OFF.t[0]*R())+'px '+(OFF.t[1]*R())+'px':'';
    note.style.translate=OFF.n[0]||OFF.n[1]?(OFF.n[0]*R())+'px '+(OFF.n[1]*R())+'px':''}
  const offText=()=>'tytuł x '+OFF.t[0]+' y '+OFF.t[1]+' · notka x '+OFF.n[0]+' y '+OFF.n[1]+' (rem; '+innerWidth+'×'+innerHeight+')';
  function drag(el,key){let sx=0,sy=0,o0=null;
    el.addEventListener('pointerdown',e=>{if(!H.classList.contains('edit'))return;e.preventDefault();el.setPointerCapture(e.pointerId);sx=e.clientX;sy=e.clientY;o0=OFF[key].slice()});
    el.addEventListener('pointermove',e=>{if(!o0)return;const r=R();OFF[key]=[+(o0[0]+(e.clientX-sx)/r).toFixed(2),+(o0[1]+(e.clientY-sy)/r).toFixed(2)];applyOff();lbl.textContent=offText()});
    const end=()=>{if(!o0)return;o0=null;history.replaceState(null,'',query());alignNote();cacheCh()};
    el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end)}
  drag(title,'t');drag(note,'n');
  /* the note's first line level with the top of the title's capitals: the baseline of the first line (an empty
     inline-block on it) minus the cap height, and the same for the note's own first line */
  const capH=font=>{const c=capH.c||(capH.c=document.createElement('canvas').getContext('2d'));c.font=font;return c.measureText('H').actualBoundingBoxAscent};
  const baseMark=()=>{const b=document.createElement('i');b.style.cssText='display:inline-block;width:0;height:0;vertical-align:baseline';return b};
  function alignNote(){H.style.removeProperty('--nt');if(!desk()||V!=='1')return;
    const nt=note.style.translate;note.style.translate='';
    const ln=title.querySelector('.ln'),b=baseMark();ln.append(b);const base=b.getBoundingClientRect().top;b.remove();
    const tcap=base-capH('900 '+parseFloat(getComputedStyle(title).fontSize)+'px "Inter Tight"');
    const nb=baseMark();note.prepend(nb);
    const noff=nb.getBoundingClientRect().top-note.getBoundingClientRect().top-capH('400 '+parseFloat(getComputedStyle(note).fontSize)+'px "Inter Tight"');nb.remove();
    H.style.setProperty('--nt',(tcap-pin.getBoundingClientRect().top-noff)+'px');note.style.translate=nt}
  /* the O of the face: advance, ink box and counter (the white inside), in em, from a canvas rendering */
  let OC={w:.3,h:.45,dx:0,dy:0},FS=100;
  function measureO(){const fam=getComputedStyle(title).fontFamily,Z=200,c=document.createElement('canvas'),g2=c.getContext('2d');
    g2.font='900 '+Z+'px '+fam;const m=g2.measureText('O'),l=m.actualBoundingBoxLeft,r=m.actualBoundingBoxRight,a=m.actualBoundingBoxAscent,d=m.actualBoundingBoxDescent;
    const set=(k,v)=>title.style.setProperty(k,(v/Z).toFixed(4)+'em');
    set('--ow',m.width);set('--ol',-l);set('--od',-d);set('--obw',l+r);set('--obh',a+d);
    c.width=Math.ceil(l+r+20);c.height=Math.ceil(a+d+20);g2.font='900 '+Z+'px '+fam;g2.fillStyle='#000';g2.fillText('O',10+l,10+a);
    const D=g2.getImageData(0,0,c.width,c.height).data,ink=(x,y)=>D[(y*c.width+x)*4+3]>128;
    const cx=Math.round(10+(l+r)/2),cy=Math.round(10+(a+d)/2);   // the middle of the ink box
    let x0=cx,x1=cx,y0=cy,y1=cy;while(x0>0&&!ink(x0-1,cy))x0--;while(x1<c.width-1&&!ink(x1+1,cy))x1++;
    const mx=Math.round((x0+x1)/2);while(y0>0&&!ink(mx,y0-1))y0--;while(y1<c.height-1&&!ink(mx,y1+1))y1++;
    OC={w:(x1-x0+1)/Z,h:(y1-y0+1)/Z,dx:((x0+x1)/2-(10+(l+r)/2))/Z,dy:((y0+y1)/2-(10+(a+d)/2))/Z}}
  /* exit 2/3: every letter is pushed away from the O's middle (and grows a little) while the O becomes the screen */
  let CHS=[];
  function cacheCh(){const o=win().getBoundingClientRect(),ox=o.left+o.width/2,oy=o.top+o.height/2;
    CHS=[...title.querySelectorAll('.ch')].map(c=>{c.style.translate='';c.style.scale='';const r=c.getBoundingClientRect();return [c,r.left+r.width/2-ox,r.top+r.height/2-oy]})}
  function placeWin4(){const ls=title.querySelectorAll('.ln');if(ls.length<3)return;const p=pin.getBoundingClientRect(),a=ls[1].getBoundingClientRect(),b=ls[2].getBoundingClientRect();
    winSolo.style.setProperty('--wy',((a.top+b.bottom)/2-p.top)+'px')}
  /* note: words, grouped into lines for the flip-in (the original's text-anim, line mode) */
  const NOTE=note.textContent;
  function splitNote(){note.innerHTML=NOTE.split(' ').map(w=>`<span class="w">${w}</span>`).join(' ')}
  const noteLines=()=>{const ws=[...note.querySelectorAll('.w')],tops=[...new Set(ws.map(w=>w.offsetTop))].sort((a,b)=>a-b);return tops.map(t=>ws.filter(w=>w.offsetTop===t))};

  /* the window: a placeholder's rectangle → the stage's clip; scroll p 0..1 grows it to the screen */
  const win=()=>document.getElementById('winIn')&&getComputedStyle(document.getElementById('winIn').parentNode).display!=='none'?document.getElementById('winIn'):winSolo;
  // entrance: win 0 → 1 opens the window from its middle; go 0 → 1 carries it from the loader's oval (screen middle,
  // 10 × 10.5rem) to the O; coil 0 → 1 grows the coil in; spin keeps it turning faster (the loader, the spin-in)
  const E={win:0,go:1,coil:1,spin:0};
  const quadOut=t=>1-(1-t)*(1-t),quartOut=t=>1-Math.pow(1-t,4),clamp=v=>Math.min(1,Math.max(0,v));
  let P=0;
  function frame(now){
    // (every position is taken in the black layer's own box: the clip-path insets and the coil's canvas live there. The
    //  window's innerWidth counts the scrollbar, the layer does not: measured against innerWidth, the O lost 15px on the
    //  right and the coil sat 7px off its middle on every desktop with a scrollbar)
    const el=win(),r=el.getBoundingClientRect(),sr=stage.getBoundingClientRect(),W=document.documentElement.clientWidth,Hh=innerHeight;
    const hero=document.querySelector('.hero');P=clamp(-hero.getBoundingClientRect().top/(hero.offsetHeight-Hh));
    const g=E.go,pw=R()*10,ph=pw*1.05,bw=pw+(r.width-pw)*g,bh=ph+(r.height-ph)*g,sc=bw/r.width;
    const e=E.win,cx=W/2+(r.left+r.width/2-W/2)*g,cy=Hh/2+(r.top+r.height/2-Hh/2)*g,w0=bw*e,h0=bh*e;
    const k=quadOut(clamp(P/.75));
    const L=(cx-w0/2-sr.left)*(1-k),T=(cy-h0/2-sr.top)*(1-k),Rt=(sr.right-(cx+w0/2))*(1-k),B=(sr.bottom-(cy+h0/2))*(1-k);
    // corners: 4px, squared off over the last quarter; layout 2's oval opens into the rectangle over the first 60 %
    const oval=V==='2',j=clamp(k/.6),cr=1-quadOut(clamp((P-.75)/.25));
    // (the loader is an oval in every layout; in layout 2 it stays one, as the O)
    const ex=w0/2*(1-j)+4*j,ey=h0/2*(1-j)+4*j,rx=(oval?ex:ex*(1-g)+4*g)*cr,ry=(oval?ey:ey*(1-g)+4*g)*cr;
    stage.style.clipPath=`inset(${T}px ${Rt}px ${B}px ${L}px round ${rx}px / ${ry}px)`;
    if(H.classList.contains('pre'))H.classList.remove('pre');
    // title, note and stripes fade over the first half (the original's --o, quad out)
    const o=1-quadOut(clamp(P/.5));
    if(P!==frame.lastP){frame.lastP=P;
      document.querySelectorAll('.fade,#title .ln').forEach(f=>f.style.opacity=o);   // (layout 3's title is display:contents: its lines fade themselves)
      const bl=(X==='1'||X==='3')?(X==='1'?18:9)*quadOut(clamp(P/.5))*R()/14:0;
      title.style.filter=note.style.filter=bl>.05?'blur('+bl.toFixed(2)+'px)':'';
      const s=(X==='2'||X==='3')?quadOut(clamp(P/.55)):0;
      CHS.forEach(([c,dx,dy])=>{c.style.translate=s?(dx*s*1.3).toFixed(1)+'px '+(dy*s*1.3).toFixed(1)+'px':'';c.style.scale=s?String(1+.35*s):''})}
    // coil: from the window's middle and size to the screen's, half a turn and tilting flat (the original's scene)
    let ccx=cx,ccy=cy;if(oval){ccx=cx+OC.dx*FS*sc;ccy=cy+OC.dy*FS*sc}
    const PX=ccx+(W/2-ccx)*k-sr.left,PY=ccy+(Hh/2-ccy)*k-sr.top,turn=quartOut(clamp(P/.75));
    window.__o={cx,cy,ccx,ccy,OC,FS,r:[r.left,r.top,r.width,r.height]};
    if(GL){
      // in the O: face-on and still (no sway, no mouse: a turned ring has one thick and one thin side and reads off-centre),
      // ~90% of the counter's width, turning only about its own axis; growing: to .75 of the screen (the original's scale),
      // tipping to the main page's 60° and half a turn, the sway coming back with it
      const u=3.6*cv.clientHeight/4.823;
      if(E.spin>.01)GL.kick(E.spin);
      const D0=(oval?OC.w*FS*sc*e*.9:Math.min(w0,h0)*.8)*E.coil,D1=Math.min(W,Hh)*.75,D=D0+(D1-D0)*quartOut(clamp(P));
      GL.setPos(PX,PY);GL.setPose((oval?0:.35)+((oval?1.05:.7))*turn,Math.max(D,.01)/u,-Math.PI*turn,oval?turn:.3+.7*turn,0);GL.draw(now/1000)}
    else{const m1=Math.min(W,Hh)*.95;let m0=Math.min(w0,h0)*1.05,sq0=1;if(oval){m0=OC.w*FS*e/.74;sq0=OC.h/OC.w}
      drawCoil(now/1000,PX,PY,m0+(m1-m0)*quartOut(clamp(P)),turn,1+(sq0-1)*(1-k),oval?1-k:0)}
    requestAnimationFrame(frame)}

  /* the coil: the main page's metal one (Three.js, same geometry, material and studio light); the 2D drawing only
     if WebGL is missing */
  const coarse=matchMedia('(pointer: coarse)').matches;
  function GLCoil(canvas,opt={}){
    const mk=opt.mouse||1;
    if(!window.THREE)return null;
    let renderer;
    try{renderer=new THREE.WebGLRenderer({canvas,antialias:!coarse,alpha:true,powerPreference:'high-performance'})}catch(e){return null}
    renderer.setPixelRatio(Math.min(devicePixelRatio||1,coarse?1.5:2));
    renderer.outputEncoding=THREE.sRGBEncoding;
    renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
    renderer.setClearColor(0x000000,0);
    const scene=new THREE.Scene();
    const cam=new THREE.PerspectiveCamera(30,1,.1,100);cam.position.set(0,0,9);
    // a dark studio with a few softbox strips, baked once into an environment map for the reflections
    const studio=new THREE.Scene();studio.background=new THREE.Color(0x000000);
    const box=(w,h,x,y,z,v)=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({color:new THREE.Color(v,v,v),side:THREE.DoubleSide}));m.position.set(x,y,z);m.lookAt(0,0,0);studio.add(m)};
    box(7,1.1,0,5,2,4.2);box(.9,8,-6,0,1.5,2.6);box(.9,8,6,1,-2,1.4);box(9,.5,0,-5,3,.7);box(2.5,2.5,3,3,6,1.1);
    const pm=new THREE.PMREMGenerator(renderer);scene.environment=pm.fromScene(studio,.03).texture;pm.dispose();
    class Helix extends THREE.Curve{constructor(R,r,n){super();this.R=R;this.r=r;this.n=n}
      getPoint(t,o=new THREE.Vector3()){const p=t*Math.PI*2,th=p*this.n,rr=this.R+this.r*Math.cos(th);return o.set(rr*Math.cos(p),rr*Math.sin(p),this.r*Math.sin(th))}}
    const turns=coarse?22:28;
    const geo=new THREE.TubeGeometry(new Helix(1.22,.5,turns),turns*(coarse?22:36),.078,coarse?10:16,true);
    const mat=new THREE.MeshPhysicalMaterial({color:0xdedede,metalness:1,roughness:.2,clearcoat:.5,clearcoatRoughness:.25});
    // shade from above: everything above height uY (±uW) goes dark by uAmt, like the light falling off at the top
    const shadeU={uY:{value:3},uW:{value:.75},uAmt:{value:0}};
    mat.onBeforeCompile=sh=>{Object.assign(sh.uniforms,shadeU);
      sh.vertexShader='varying float vWY;\n'+sh.vertexShader.replace('#include <project_vertex>','#include <project_vertex>\n  vWY=(modelMatrix*vec4(transformed,1.0)).y;');
      sh.fragmentShader='uniform float uY;uniform float uW;uniform float uAmt;varying float vWY;\n'+sh.fragmentShader.replace('#include <dithering_fragment>','gl_FragColor.rgb*=1.0-uAmt*smoothstep(uY-uW,uY+uW,vWY);\n#include <dithering_fragment>')};
    const grp=new THREE.Group();grp.add(new THREE.Mesh(geo,mat));scene.add(grp);
    const key=new THREE.DirectionalLight(0xffffff,.9);key.position.set(-3,4,5);scene.add(key);
    let W=0,H=0;
    function size(){W=canvas.clientWidth;H=canvas.clientHeight;if(!W||!H)return;renderer.setSize(W,H,false);cam.aspect=W/H;cam.updateProjectionMatrix()}
    size();
    // compile the metal's shaders now, while the page loads (on a phone the first draw otherwise froze the scroll for ~.2 s)
    try{renderer.compile(scene,cam)}catch(e){}
    let spin=0,last=0,vel=0,mx=0,my=0,tmx=0,tmy=0,tilt=1.05,pscale=1,dark=0;
    if(!coarse)addEventListener('pointermove',e=>{tmx=e.clientX/innerWidth-.5;tmy=e.clientY/innerHeight-.5},{passive:true});
    function draw(t){
      if(!W)size();if(!W)return;
      const dt=Math.min(.05,Math.max(0,t-last));last=t;
      spin+=dt*(.32+Math.min(vel,4)*.8);vel*=.93;            // scroll speed spins it faster, then it calms down
      mx+=(tmx-mx)*.05;my+=(tmy-my)*.05;                       // the cursor tilts it slightly
      grp.rotation.set(tilt+(Math.sin(t*.37)*.1+my*.3*mk)*sway,yaw+(Math.sin(t*.23)*.2+mx*.4*mk)*sway,spin+zr);grp.scale.setScalar(pscale*(1-.15*dark));
      renderer.render(scene,cam);
    }
    const full=geo.index.count;
    const setShade=(amt,y)=>{shadeU.uAmt.value=amt;shadeU.uY.value=y};
    // at the end the shadow line keeps sliding down until the whole coil is in the dark, while it recedes a little
    // the shadow line slides down slowly, so a faint lower rim is still there when the texts start to leave;
    // the last 20% fades what is left together with the texts
    let lastOp=-1;   // (styles are written only when they change: a write every frame keeps the page restyling)
    const setDark=v=>{dark=v;setShade(.9+.1*v,.35-1.5*v);const o=v<.8?1:Math.max(0,(1-v)/.2);if(o!==lastOp){lastOp=o;canvas.style.opacity=o}};
    let zr=0,sway=1,yaw=0;const setPose=(tl,sc,z=0,sw=1,y=0)=>{tilt=tl;pscale=sc;zr=z;sway=sw;yaw=y};
    // place the coil centre at screen pixel (px,py) of its canvas (camera at z 9, 30° fov → 4.823 units of height)
    const setPos=(px,py)=>{if(!W)size();if(!H)return;const k=2*9*Math.tan(Math.PI/12)/H;grp.position.set((px-W/2)*k,-(py-H/2)*k,0)};
    return {draw,size,canvas,setDark,setShade,setPose,setPos,dpr:v=>{renderer.setPixelRatio(v);size()},kick:v=>{vel=Math.max(vel,Math.abs(v))},
      setProgress:v=>geo.setDrawRange(0,Math.floor(full*Math.min(1,Math.max(0,v))/6)*6)};   // the wire is drawn along its length
  }
  const GL=GLCoil(cv);
  const g=GL?null:cv.getContext('2d');let dpr=1,CW=0,CH=0;
  function size(){if(GL){GL.size();return}dpr=Math.min(devicePixelRatio||1,1.75);CW=cv.clientWidth;CH=cv.clientHeight;cv.width=CW*dpr;cv.height=CH*dpr}
  const SEG=900,TURNS=26,Pt=new Float32Array((SEG+1)*4),order=[...Array(SEG).keys()],Lt=[-.45,-.62,.64];{const n=Math.hypot(...Lt);Lt.forEach((v,i)=>Lt[i]=v/n)}
  function drawCoil(t,X,Y,m,turn,sq=1,wt=0){
    g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,CW,CH);if(m<4)return;
    const Rr=m*.27,rr=m*.1,f=m*1.6;
    // at rest face-on (the hole in the middle, a small sway), tipping to the side view as the window grows
    const sw=turn,ax=1.05*turn+Math.sin(t*.37)*.1*sw,az=t*.3-Math.PI*turn,ay=Math.sin(t*.23)*.2*sw;
    const cx=Math.cos(ax),sx=Math.sin(ax),cz=Math.cos(az),sz=Math.sin(az),cy=Math.cos(ay),sy=Math.sin(ay);
    const rot=(x,y,z)=>{const x1=x*cz-y*sz,y1=x*sz+y*cz,y2=y1*cx-z*sx,z2=y1*sx+z*cx;return [x1*cy+z2*sy,y2,-x1*sy+z2*cy]};
    for(let i=0;i<=SEG;i++){const ph=i/SEG*Math.PI*2,th=ph*TURNS+t*1.2,q=Rr+rr*Math.cos(th);
      const p=rot(q*Math.cos(ph),q*Math.sin(ph),rr*Math.sin(th)),n=rot(Math.cos(th)*Math.cos(ph),Math.cos(th)*Math.sin(ph),Math.sin(th)),k=f/(f+p[2]);
      Pt[i*4]=X+p[0]*k;Pt[i*4+1]=Y+p[1]*k*sq;Pt[i*4+2]=p[2];const d=Math.max(0,n[0]*Lt[0]+n[1]*Lt[1]-n[2]*Lt[2]);Pt[i*4+3]=.06+.75*d*d+.55*Math.pow(d,24)}
    // (colour: white in the O, metal once the window has grown)
    order.sort((a,b)=>Pt[b*4+2]-Pt[a*4+2]);g.lineCap='round';const lw=rr*.36;
    for(const i of order){const b=Math.min(1,Pt[i*4+3]),k=f/(f+Pt[i*4+2]);g.lineWidth=lw*k;const c=(wt*(175+80*b)+(1-wt)*225*b)|0;g.strokeStyle=`rgb(${c},${c},${c})`;
      g.beginPath();g.moveTo(Pt[i*4],Pt[i*4+1]);g.lineTo(Pt[i*4+4],Pt[i*4+5]);g.stroke()}}

  /* entrance, as the original (no random scatter): letters flip up one after another (1.1 s quart in-out, .035 s apart),
     the note's lines flip up from .35 s (.5 s quad in-out, .1 s apart), the window opens from its middle,
     the stripes rise from the lowest, the header's hairline draws in */
  let tl=null;
  /* A · as the original: the letters one after another, the O opens from its middle at .45 s, the note, the stripes.
     B · the O first: it opens and the coil spins in (.9 s quart out), then the letters flip up in a wave running out from
         the O (delay by distance, up to .55 s), then the note and the stripes.
     C · the loader becomes the O: while loading, the oval with a fast-turning coil in the middle of the empty page; when
         ready (at least .9 s) it travels into the O and shrinks (1.15 s quart in-out) while the letters flip up around it;
         the header, the note and the stripes follow. On the first load the oval is already there (CSS); ↻ replays it. */
  function enter(){
    tl&&tl.kill();const ch=[...title.querySelectorAll('.ch')],nl=noteLines(),st=[...document.querySelectorAll('.stripes i')].reverse();
    gsap.set(ch,{'--rx':'-90deg','--sy':1.5});nl.forEach(l=>gsap.set(l,{'--rx':'-90deg','--sy':1.5}));gsap.set(st,{opacity:0,'--y':'100%'});
    tl=gsap.timeline();
    const lines=at=>nl.forEach((l,i)=>tl.to(l,{'--rx':'0deg','--sy':1,duration:.5,ease:'power1.inOut'},at+i*.1));
    const bars=at=>st.forEach((s,i)=>tl.set(s,{opacity:1},at+i*.15).to(s,{'--y':'0%',duration:.75,ease:'power4.out'},at+i*.15));
    const flip=(at,stagger)=>tl.to(ch,{'--rx':'0deg','--sy':1,duration:1.1,ease:'power4.inOut',stagger},at);
    if(IN==='A'){Object.assign(E,{win:0,go:1,coil:1,spin:0});gsap.set('.hd',{opacity:1});
      flip(0,.035);tl.to(E,{win:1,duration:1.1,ease:'power4.inOut'},.45);lines(.35);bars(.6)}
    else if(IN==='B'){Object.assign(E,{win:0,go:1,coil:1,spin:4});gsap.set('.hd',{opacity:1});
      const o=win().getBoundingClientRect(),ox=o.left+o.width/2,oy=o.top+o.height/2;
      const d=ch.map(c=>{const r=c.getBoundingClientRect();return Math.hypot(r.left+r.width/2-ox,r.top+r.height/2-oy)}),dm=Math.max(...d);
      tl.to(E,{win:1,duration:.9,ease:'power4.out'},0).to(E,{spin:0,duration:1.6,ease:'power2.out'},0);
      flip(.5,i=>d[i]/dm*.55);lines(1);bars(1.1)}
    else{const fresh=!enter.ran;Object.assign(E,{win:fresh?1:0,go:0,coil:0,spin:2.5});gsap.set('.hd',{opacity:0});
      if(!fresh)tl.to(E,{win:1,duration:.6,ease:'power4.out'},0);
      tl.to(E,{coil:1,duration:.8,ease:'power3.out'},fresh?0:.2);
      const M=fresh?.9:1.2;
      tl.to(E,{go:1,duration:1.15,ease:'power4.inOut'},M).to(E,{spin:0,duration:1.4,ease:'power2.out'},M)
        .to('.hd',{opacity:1,duration:.6,ease:'power1.out'},M+.6);
      flip(M+.5,.035);lines(M+.9);bars(M+1)}
    enter.ran=true}
  document.querySelectorAll('.ctl [data-w]').forEach(b=>b.onclick=()=>{IN=b.dataset.w;apply()});
  document.getElementById('replay').onclick=()=>{scrollTo(0,0);enter()};
  document.getElementById('edit').onclick=e=>{const on=H.classList.toggle('edit');e.currentTarget.setAttribute('aria-pressed',on);scrollTo(0,0);
    if(on){tl&&tl.progress(1);lbl.textContent=offText();lbl.classList.remove('off')}else apply()};
  document.getElementById('copy').onclick=()=>{const t=offText()+'\n'+location.href;navigator.clipboard?navigator.clipboard.writeText(t).then(()=>{lbl.textContent='Skopiowano: '+offText()},()=>{lbl.textContent=t}):lbl.textContent=t};
  document.getElementById('zero').onclick=()=>{OFF.t=[0,0];OFF.n=[0,0];applyOff();history.replaceState(null,'',query());alignNote();cacheCh();lbl.textContent=offText()};
  addEventListener('keydown',e=>{const k=e.key.toUpperCase();if(k==='A'||k==='B'||k==='C'){IN=k;apply()}});
  let lastW=innerWidth;addEventListener('resize',()=>{size();if(innerWidth!==lastW){lastW=innerWidth;fit();if(V==='4')placeWin4();applyOff();alignNote();cacheCh()}});
  size();
  // every face is loaded before the first measure, so switching never fits a line in a fallback font
  const FACES=['900 100px "Inter Tight"','400 15px "Inter Tight"','900 100px Archivo','900 100px "Schibsted Grotesk"'];
  Promise.race([document.fonts?Promise.all(FACES.map(f=>document.fonts.load(f))).catch(()=>{}):0,new Promise(r=>setTimeout(r,3000))]).then(()=>{apply();requestAnimationFrame(frame)});
})();
</script>
